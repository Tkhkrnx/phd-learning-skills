version: 2
cases:
  - id: route-academic-metadata-search
    user_prompt: "用学术检索 skill 查来源并导出 bib。"
    expected: nature-academic-search
  - id: route-engineering-implementation
    user_prompt: "用工程开发 skill 实现这个已确认需求，并跑完相关测试。"
    expected: engineering-task-decomposition
  - id: route-material-course
    user_prompt: "用课程学习 skill 带我学这一章，记录练习供下次继续。"
    expected: targeted-knowledge-closure
  - id: reference-report-bounded-discovery
    active_skill: reference-validation-report
    active_scope: "查找缺失来源并生成引用核验报告"
    user_prompt: "这些条目缺 DOI，先查齐能查到的元数据，再继续报告。"
    expected: reference-validation-report
    expected_support:
      - nature-academic-search
  - id: bypass-ordinary-export-request
    user_prompt: "把这份文献清单导出 bib，不需要报告。"
    expected: none
    forbidden_support:
      - reference-validation-report
      - nature-academic-search
  - id: route-paper-ppt-alias
    user_prompt: "用做PPT的 skill 按我的模板补齐论文汇报。"
    expected: paper-presentation-builder
  - id: route-paper-talk-alias
    user_prompt: "请用论文汇报技能把这份分析做成 PPT。"
    expected: paper-presentation-builder
  - id: bypass-ppt-semantic
    user_prompt: "按我的模板把剩下的 PPT 做完。"
    expected: none
    forbidden_support:
      - paper-presentation-builder
  - id: bypass-note-to-ppt-pivot
    active_skill: reading-note-builder
    active_scope: "生成 BatchGen 阅读笔记"
    user_prompt: "笔记可以了，现在把剩下的 PPT 做完。"
    expected: none
    forbidden_support:
      - paper-presentation-builder
  - id: allow-explicit-note-to-ppt
    active_skill: reading-note-builder
    active_scope: "生成 BatchGen 阅读笔记"
    user_prompt: "笔记可以了，现在用论文PPT的 skill 补齐汇报。"
    expected: paper-presentation-builder
  - id: route-problem-alias
    user_prompt: "请用问题定义的 skill 判断这个 Agent 调度想法是否构成学术问题。"
    expected: research-problem-formulation
  - id: route-method-alias
    user_prompt: "问题已经明确，请用研究方法的 skill 帮我找可行方案。"
    expected: research-method-design
  - id: route-engineering-alias
    user_prompt: "调用需求澄清那个技能，把这个 provider 切换需求弄清楚。"
    expected: engineering-task-decomposition
  - id: route-teaching-alias
    user_prompt: "用教学 skill 带我学会条件概率。"
    expected: targeted-knowledge-closure
  - id: route-paper-search-alias
    user_prompt: "请用文献搜索技能找最近三年的相关论文。"
    expected: topic-paper-finder
  - id: route-writing-alias
    user_prompt: "请用系统论文写作 skill 审计这份 OSDI 稿件。"
    expected: systems-paper-writing
  - id: route-planning-alias
    user_prompt: "请用文件规划的 skill 管理这项长期任务。"
    expected: planning-with-files
  - id: route-figure-alias
    user_prompt: "调用科研绘图技能为这组数据选择合适的图。"
    expected: scipilot-figure-skill
  - id: bypass-problem-semantic
    user_prompt: "判断这个 Agent 调度想法是否构成学术问题。"
    expected: none
  - id: bypass-method-semantic
    user_prompt: "问题已经明确，帮我找几个可行方案。"
    expected: none
  - id: bypass-engineering-semantic
    user_prompt: "分析这个 provider 切换需求并给出验收标准。"
    expected: none
  - id: bypass-teaching-semantic
    user_prompt: "带我真正学会条件概率。"
    expected: none
  - id: bypass-paper-search-semantic
    user_prompt: "找最近三年的相关论文。"
    expected: none
    forbidden_support:
      - topic-paper-finder
  - id: bypass-long-execution
    user_prompt: "继续修复 replay，跑完实验并提交 PR。"
    expected: none
  - id: clarify-generic-skill
    user_prompt: "用一个合适的 skill 帮我处理这件事。"
    expected: clarify
  - id: continue-authorized-collaboration
    active_skill: research-method-design
    active_scope: "为已定义的状态复用问题比较研究方法"
    user_prompt: "我认为候选 B 的状态迁移代价会抵消收益，你再按这个约束比较。"
    expected: research-method-design
  - id: delegate-method-paper-search
    active_skill: research-method-design
    active_scope: "为已定义的状态复用问题比较研究方法"
    user_prompt: "这些候选的证据还不够，请补齐本领域、相邻领域和跨领域论文，再回到机制比较。"
    expected: research-method-design
    expected_support:
      - topic-paper-finder
  - id: delegate-problem-paper-search
    active_skill: research-problem-formulation
    active_scope: "判断 Agent 状态复用的尾延迟现象是否构成学术问题"
    user_prompt: "先把最接近工作、失败案例和反证查足，再和我一起判断这个边界是否还成立。"
    expected: research-problem-formulation
    expected_support:
      - topic-paper-finder
  - id: delegate-engineering-concept-closure
    active_skill: engineering-task-decomposition
    active_scope: "澄清 provider 切换需求和一致性边界"
    user_prompt: "linearizability 这个概念直接卡住了我对接口边界的判断，先带我弄懂并应用到这里，再继续需求分析。"
    expected: engineering-task-decomposition
    expected_support:
      - targeted-knowledge-closure
  - id: expire-on-direct-execution
    active_skill: research-method-design
    active_scope: "为已定义的状态复用问题比较研究方法"
    user_prompt: "方案就定 B，现在直接改代码、跑实验并提交 PR。"
    expected: none
    forbidden_support:
      - engineering-task-decomposition
  - id: expire-on-task-switch
    active_skill: targeted-knowledge-closure
    active_scope: "学习条件概率"
    user_prompt: "顺便帮我审查另一个仓库的代码。"
    expected: none
    forbidden_support:
      - engineering-task-decomposition
  - id: reject-implicit-primary-transition
    active_skill: research-problem-formulation
    active_scope: "定义 Agent 调度的学术问题"
    user_prompt: "问题定义先到这里，接下来你正常给我列几个可能方向。"
    expected: none
    forbidden_support:
      - research-method-design
  - id: reject-unrelated-writing-delegation
    active_skill: research-method-design
    active_scope: "为已定义的状态复用问题比较研究方法"
    user_prompt: "方案先不聊了，顺便把论文方法章节直接写完。"
    expected: none
    forbidden_support:
      - systems-paper-writing
  - id: allow-explicit-primary-transition
    active_skill: research-problem-formulation
    active_scope: "定义 Agent 调度的学术问题"
    user_prompt: "问题、重要性和现有工作边界已经稳定，现在请用研究方法的 skill 带我设计方案。"
    expected: research-method-design
